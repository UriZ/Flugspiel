<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flugspiel — Missile Attack harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module">
    // Defaults: human mode, emission off — so this page is the upstream play
    // experience. Serve from the repo root so `assets/...` resolves.
    import { createGame } from './src/game/index.js';
    const { game, bridge } = createGame(document.getElementById('game'));
    window.game = game;
    window.bridge = bridge;   // console-drivable for manual verification (spec §6.3)
  </script>
</body>
</html>
