<!DOCTYPE html>
<!--
  Spike fixture for #5 — NOT the shell. This is the throwaway page the #5 spec's
  measurements were taken against, kept so the numbers in shell-fps.mjs can be
  re-derived before index.html exists:

    node tools/spike/shell-fps.mjs --url /tools/spike/shell-probe.html

  It stands in for the real shell with a synthetic viz load (1000 fillRects/frame)
  and the game hosted in a same-origin iframe. Delete once index.html ships and the
  harness is pointed at it.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flugspiel shell spike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
  #app { display: grid; grid-template-columns: var(--split, 1fr) 6px 1fr; grid-template-rows: 1fr 28px; height: 100%; }
  @media (max-width: 767px) { #app { grid-template-columns: 1fr; grid-template-rows: 1fr 6px 1fr 28px; } }
  #viz, #game { position: relative; overflow: hidden; }
  #divider { background: #222; cursor: col-resize; }
  #status { grid-column: 1 / -1; color: #ccc; font: 12px ui-monospace, monospace; padding: 6px; }
  canvas, iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="app">
  <div id="viz"><canvas id="viz-canvas"></canvas></div>
  <div id="divider" data-role="divider"></div>
  <div id="game"><iframe src="/game.html" title="game"></iframe></div>
  <div id="status">spike fixture</div>
</div>
<script>
  const c = document.getElementById('viz-canvas');
  const ctx = c.getContext('2d');
  (function loop() {
    const r = c.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 1000; i++) {
      ctx.fillStyle = i % 3 ? '#3fa' : '#f53';
      ctx.fillRect((i * 37) % w, (i * 61) % h, 2, 2);
    }
    requestAnimationFrame(loop);
  })();

  // rAF-coalesced divider drag — one layout write per frame, never one per pointermove.
  const app = document.getElementById('app');
  let dragging = false, pending = 0, scheduled = false;
  document.getElementById('divider').addEventListener('pointerdown', (e) => {
    dragging = true; e.target.setPointerCapture(e.pointerId);
  });
  addEventListener('pointermove', (e) => {
    if (!dragging) return;
    pending = e.clientX;
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; app.style.setProperty('--split', pending + 'px'); });
  });
  addEventListener('pointerup', () => { dragging = false; });
</script>
</body>
</html>
